[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minipipe"
version = "0.1.1"
description = "Minimal distributed pipeline runner with pluggable execution backends."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }

[project.optional-dependencies]
dev = ["ruff", "pytest", "pytest-cov"]

[tool.setuptools]
packages = ["minipipe"]

[tool.ruff]
line-length = 160

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=minipipe --cov-report=term-missing --cov-report=xml"

[tool.coverage.run]
branch = true
